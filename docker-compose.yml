version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: handymench-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: handymench
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - handymench-network

  backend:
    build: .
    container_name: handymench-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/handymench?authSource=admin
      JWT_SECRET: your_super_secret_jwt_key_here_make_it_long_and_random
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - handymench-network

  redis:
    image: redis:7-alpine
    container_name: handymench-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - handymench-network

volumes:
  mongodb_data:
  redis_data:

networks:
  handymench-network:
    driver: bridge